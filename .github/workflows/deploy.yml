name: Deploy
on:
  push:
    branches:
      - deploy-trigger
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          if [ -n "$SSHPASS" ]; then
            sshpass -e ssh -o StrictHostKeyChecking=no root@176.124.200.114 "cd /opt/warehouse_bot && git fetch origin main && git reset --hard origin/main && docker compose build backend frontend && docker compose up -d backend frontend"
          else
            sshpass -p 'rz7r-Z@PzCbK9K' ssh -o StrictHostKeyChecking=no root@176.124.200.114 "cd /opt/warehouse_bot && git fetch origin main && git reset --hard origin/main && docker compose build backend frontend && docker compose up -d backend frontend"
          fi
